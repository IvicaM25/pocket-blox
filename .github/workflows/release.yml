name: Android release bundle
# Builds the Play Store bundle (real ads). It is signed afterwards, outside GitHub, with the private upload key.
# Start it by changing release.txt (one line: the Play versionCode).
on:
  push:
    branches: [main]
    paths: ['release.txt']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Read version code
        run: echo "VC=$(tr -dc 0-9 < release.txt)" >> $GITHUB_ENV
      - name: Build web game with real ads
        run: python3 build.py release && grep -q "testing:false/\*TESTING\*/" app/www/index.html
      - name: Sync Capacitor
        working-directory: app
        run: npm ci && npx cap sync android
      - name: Build release bundle (unsigned)
        working-directory: app/android
        run: sed -i "s/versionCode [0-9]*/versionCode ${VC}/" app/build.gradle && chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Publish unsigned bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/bundle/release/app-release.aab PocketBlox-unsigned.aab
          gh release create "release-${VC}" --prerelease --title "Play bundle ${VC}" --notes "Unsigned Play Store bundle. Not installable; signed separately before upload." PocketBlox-unsigned.aab
