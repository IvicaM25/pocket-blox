name: iOS TestFlight upload
# Change ios-release.txt (one line: build number, add the word store for the App Store build with real ads) to build, sign and upload.
# Needs one repository secret: ASC_KEY_P8 (content of the App Store Connect .p8 key file).
on:
  push:
    branches: [main]
    paths: ['ios-release.txt']
permissions:
  contents: read
env:
  ASC_KEY_ID: 7M3S5D865D
  ASC_ISSUER_ID: 8587971c-667e-4162-8c3c-14cdf056d569
  TEAM: LN7Q2Y2LLT
jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build web game (test ads for TestFlight, real ads only when ios-release.txt says "store")
        run: |
          if grep -qi store ios-release.txt; then python3 build.py release; else python3 build.py ci; fi
          grep -o "testing:[a-z]*/\*TESTING\*/" app/www/index.html
      - name: Sync Capacitor
        working-directory: app
        run: npm ci && npx cap sync ios
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuild a clean PEM file: copying on iPad can turn line breaks into spaces.
          python3 - "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" <<'PY'
          import os,re,sys,base64,textwrap
          raw=os.environ["ASC_KEY_P8"]
          body=re.sub(r"-----(BEGIN|END)[A-Z ]*-----","",raw)
          body=re.sub(r"[^A-Za-z0-9+/=]","",body)
          base64.b64decode(body)  # fails loudly if the key text is incomplete
          pem="-----BEGIN PRIVATE KEY-----\n"+"\n".join(textwrap.wrap(body,64))+"\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1],"w").write(pem)
          print("key lines:",pem.count("\n"),"chars:",len(body))
          PY
          echo "BN=$(tr -dc 0-9 < ios-release.txt)" >> $GITHUB_ENV
      - name: Archive
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BN" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error|Error|warning: .*sign" "$RUNNER_TEMP/archive.log" | grep -v "^ld:" | head -25 | while IFS= read -r l; do echo "::error::$l"; done; tail -15 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/archive.log"
      - name: Export and upload to TestFlight
        working-directory: app/ios/App
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 || { grep -E "error|Error" "$RUNNER_TEMP/export.log" | head -25 | while IFS= read -r l; do echo "::error::$l"; done; tail -15 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/export.log"
