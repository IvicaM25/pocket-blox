name: Android build
on:
  push:
    branches: [main]
    paths: ['game.html','build.py','app/**','.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web game for the app
        run: python3 build.py ci
      - name: Sync Capacitor
        working-directory: app
        run: npm ci && npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-blox-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK to the test-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk PocketBlox-test.apk
          gh release view test-build >/dev/null 2>&1 || gh release create test-build --prerelease --title "Pocket Blox - Android test build" --notes "Automatic test build for Android (not for the Play Store). Install PocketBlox-test.apk on an Android phone."
          gh release upload test-build PocketBlox-test.apk --clobber
