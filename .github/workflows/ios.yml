name: iOS build check
# Builds the iOS app for the simulator (no signing) to make sure the project compiles.
on:
  push:
    branches: [main]
    paths: ['game.html','build.py','app/**','.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build web game for the app
        run: python3 build.py ci
      - name: Sync Capacitor
        working-directory: app
        run: npm ci && npx cap sync ios
      - name: Build for simulator
        working-directory: app/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
